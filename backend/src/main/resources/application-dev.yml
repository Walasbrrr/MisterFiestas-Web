# =============================================================
# Mister Fiestas API — Configuración de Desarrollo
# =============================================================
# Activar con: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# O con variable: SPRING_PROFILES_ACTIVE=dev

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.misterfiestas: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
