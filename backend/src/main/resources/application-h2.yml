# =============================================================
# Mister Fiestas API — Perfil H2 (desarrollo sin Docker)
# =============================================================
# Activar con: mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# O con variable: SPRING_PROFILES_ACTIVE=h2
# =============================================================
# Usa H2 en memoria para desarrollo rápido sin necesidad de
# PostgreSQL/Docker. Los datos se pierden al reiniciar.
# =============================================================

spring:
  datasource:
    url: jdbc:h2:mem:mister_fiestas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Desactivar Flyway en H2 — usar ddl-auto en su lugar
  flyway:
    enabled: false

  # Consola H2 para depuración
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.misterfiestas: DEBUG
    org.springframework.web: DEBUG
